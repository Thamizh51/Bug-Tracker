
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bug-tracker-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bug_tracker
      DB_USERNAME: buguser
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: bug-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bug_tracker
      MYSQL_USER: buguser
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - bug_tracker_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bug_tracker_db:
